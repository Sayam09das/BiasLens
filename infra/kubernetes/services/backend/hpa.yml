apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: biaslens-backend
  namespace: biaslens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: biaslens-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
