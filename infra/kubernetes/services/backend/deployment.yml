apiVersion: apps/v1
kind: Deployment
metadata:
  name: biaslens-backend
  namespace: biaslens
spec:
  replicas: 3
  selector:
    matchLabels:
      app: biaslens-backend
  template:
    metadata:
      labels:
        app: biaslens-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/biaslens-backend:latest
          ports:
            - containerPort: 4000
