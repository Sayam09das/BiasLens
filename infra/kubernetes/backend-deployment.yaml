---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: biaslens-prod
  labels:
    environment: production
    managed-by: terraform

---
# Backend Deployment with Enterprise Standards
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biaslens-backend
  namespace: biaslens-prod
  labels:
    app: backend
    version: v1
spec:
  replicas: 5  # Min replicas for HA
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
      environment: production
  template:
    metadata:
      labels:
        app: backend
        environment: production
        version: v1
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3001'
        prometheus.io/path: '/metrics'
    spec:
      serviceAccountName: biaslens-backend
      affinity:
        # Spread across nodes for HA
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - backend
                topologyKey: kubernetes.io/hostname
        # Prefer nodes with specific labels
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - general
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: 123456789.dkr.ecr.us-east-1.amazonaws.com/biaslens-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP

          # Environment variables from ConfigMap and Secrets
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets

          # Resource requests & limits (crucial for K8s scheduling)
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi

          # Liveness probe: K8s restarts pod if failing
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe: K8s removes from load balancer if failing
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          # Startup probe: Pod startup grace period
          startupProbe:
            httpGet:
              path: /health/startup
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          # Volume mounts
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.next

      # Volumes
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

      # Image pull secrets (for private ECR)
      imagePullSecrets:
        - name: ecr-credentials

      # Graceful shutdown
      terminationGracePeriodSeconds: 30

      # Tolerations for spot instances
      tolerations:
        - key: spot
          operator: Equal
          value: 'true'
          effect: NoSchedule

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: biaslens-prod
  labels:
    app: backend
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app: backend
    environment: production

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: biaslens-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: biaslens-backend
  minReplicas: 5
  maxReplicas: 50
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

---
# Pod Disruption Budget (for cluster updates)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: biaslens-prod
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: backend

---
# NetworkPolicy: Restrict traffic to backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: biaslens-prod
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from frontend
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 3001
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3001
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow to Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow to external APIs
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: biaslens-prod
  labels:
    app: backend
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics

---
# Backend ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: biaslens-prod
data:
  NODE_ENV: production
  PORT: '3001'
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SERVICE_NAME: biaslens-backend
  METRICS_ENABLED: 'true'
  TRACING_ENABLED: 'true'

---
# Backend Secrets (injected via CI/CD or sealed-secrets)
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: biaslens-prod
type: Opaque
data:
  # These should be base64 encoded and injected from AWS Secrets Manager
  # Example: echo -n 'my-secret' | base64
  DATABASE_URL: cG9zdGdyZXM6Ly91c2VyOnBhc3NAcG9zdGdyZXM6NTQzMi9kYgo=
  REDIS_URL: cmVkaXM6Ly9yZWRpczo2Mzc5Cg==
  JWT_ACCESS_SECRET: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24K
  JWT_REFRESH_SECRET: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24K

---
# ServiceAccount for Backend
apiVersion: v1
kind: ServiceAccount
metadata:
  name: biaslens-backend
  namespace: biaslens-prod

---
# ClusterRole for Backend
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: biaslens-backend
rules:
  # Allow reading config maps
  - apiGroups: ['']
    resources: ['configmaps']
    verbs: ['get', 'list', 'watch']
  # Allow reading secrets
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['get']

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: biaslens-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: biaslens-backend
subjects:
  - kind: ServiceAccount
    name: biaslens-backend
    namespace: biaslens-prod

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biaslens-ingress
  namespace: biaslens-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: '100'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.biaslens.app
      secretName: biaslens-tls
  rules:
    - host: api.biaslens.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
